name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - custom

concurrency:
  group: deploy-cloudflare-worker-custom
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-worker
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate translations
        run: npm run i18n:validate

      - name: Build app
        run: npm run build

      - name: Render deploy config from secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: node scripts/render-wrangler-ci.mjs

      - name: Deploy to existing Cloudflare Worker
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.ci.toml
          packageManager: npm
          secrets: |
            JWT_SECRET
