name: Validate upgrade

on:
  push:
    branches:
      - custom
      - 'codex/sync-upstream-*'
  pull_request:
    branches:
      - custom

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Install the locked dependency graph
        run: bun install --frozen-lockfile
      - name: Run unit and local Worker runtime tests
        run: bun run test
      - name: Run separate compatibility suites
        run: |
          bun run test:config-compatibility
          bun run test:generator-compatibility
          bun run test:web-crypto
          bun run test:pwa
          bun run test:webauthn-connectors
      - name: Check Worker and web types
        run: |
          bun x --no-install tsc -p tsconfig.json --noEmit
          bun x --no-install tsc -p webapp/tsconfig.json --noEmit
      - name: Validate translations
        run: bun run i18n:validate
      - name: Audit dependencies
        run: bun audit --audit-level=high
      - name: Build web app
        run: bun run build
      - name: Verify authoritative lockfile is unchanged
        run: git diff --exit-code -- package-lock.json
